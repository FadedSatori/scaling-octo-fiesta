# NATS server config for the Hermes mesh.
# Run on the G14: `nats-server -c nats.conf`
# Bound to the Tailscale interface only — never exposed on the public network.

server_name: UNIT-G14-MainNode
listen: 0.0.0.0:4222

jetstream {
    store_dir: "C:/ProgramData/Hermes/nats-jetstream"
    max_memory_store: 1GB
    max_file_store: 20GB
}

# Tighten in production: per-device NKEY auth + ACLs.
# For v0.1 the Tailscale ACL is the trust boundary.
authorization {
    timeout: 5
}

http_port: 8222   # monitoring
