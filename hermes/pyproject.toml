[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes"
version = "0.1.0"
description = "Local-first Claude-Code-style agent stack (laptop daemon)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "nats-py>=2.6",
    "uvicorn>=0.30",
    "fastapi>=0.111",
    "ollama>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
hermes      = "hermes.daemon.__main__:main"
hermes-eval = "hermes.eval.__main__:main"

[tool.setuptools.packages.find]
include = ["hermes*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".."]
